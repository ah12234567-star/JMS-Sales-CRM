<!doctype html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>جرد عبوات الأحبار | JMS</title>
<style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#f1f5f4;color:#162e29;margin:0}main{max-width:520px;margin:auto;padding:20px}header,section{background:white;padding:18px;border-radius:15px;margin:12px 0}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0}h2{font-size:18px}label{display:block;margin:12px 0 4px;font-weight:600}input,select,button{font:inherit;padding:12px;border:1px solid #9eada7;border-radius:9px;width:100%;background:white;color:inherit}button{cursor:pointer}header button{width:auto}#save{background:#155e50;color:white;margin-top:14px}button:disabled{opacity:.55}#summary{font-weight:bold;color:#155e50}li{padding:6px}#status{min-height:1.4em}

#matches{max-height:min(32vh,16rem);overflow:auto;overscroll-behavior:contain}
#matches button{display:block;text-align:start;margin:3px 0;overflow-wrap:anywhere}
#closeSearch{width:auto;margin:6px 0}#selected{font-weight:600}
#manager table{width:100%;border-collapse:collapse}#manager td,#manager th{text-align:start;padding:8px 4px;border-bottom:1px solid #dae4df}#manager td:first-child{overflow-wrap:anywhere}
</style><main><header><h1>جرد عبوات الأحبار</h1><button id="exit">خروج</button></header>
<p id="status" role="status">جارٍ تحميل الجرد…</p><section id="manager" hidden><h2>كشف جرد الأحبار</h2><button type="button" id="exportCount">تحميل إكسل</button><p id="totals" aria-live="polite"></p><table><thead><tr><th>الصنف</th><th>الرفوف</th><th>العبوات</th><th>الصافي (كجم)</th></tr></thead><tbody id="countLines"></tbody></table><button id="refresh" type="button">تحديث الكشف</button></section>
<section id="panel" hidden>
<label for="search">بحث برقم الصنف أو اسمه</label><input id="search" type="search" autocomplete="off" placeholder="اكتب رقم الصنف أو اسمه" aria-controls="results" aria-expanded="false">
<div id="results" hidden><button type="button" id="closeSearch">إغلاق البحث</button><div id="matches"></div></div>
<input id="item" type="hidden"><p id="selected" role="status"></p>
<form id="entry"><label for="shelf">رقم الرف</label><input id="shelf" required maxlength="40">
<label for="weight">وزن العبوة على الميزان (كجم)</label><input id="weight" required inputmode="decimal" autocomplete="off">
<small>وزن العبوة الفارغة ١٫٧٥ كجم</small><p id="net"></p><button id="save" disabled>حفظ والتالية</button></form></section>
<section id="history" hidden><h2>جرد الصنف</h2><p id="summary"></p><ol id="rows"></ol></section></main>
<script defer src="/vendor/xlsx.full.min.js"></script>
<script type="module">
const el=id=>document.getElementById(id);
const item=el('item'),weight=el('weight'),shelf=el('shelf'),status=el('status');
const key='jms_ink_count_draft';
let items=[],year,busy=false,requestId='',ready=false;
const kg=g=>(g/1000).toLocaleString('ar-SA',{maximumFractionDigits:3});
const normalize=s=>s.replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776)).replace(/[٫,]/g,'.').trim();
function grams(){const s=normalize(weight.value);return /^\d+(\.\d{1,3})?$/.test(s)?Math.round(Number(s)*1000):0}
function validate(){
 const g=grams();el('save').disabled=busy||!el('results').hidden||!ready||!item.value||!shelf.value.trim()||g<1750||g>1000000;
 el('net').textContent=g>=1750?'صافي العبوة '+kg(g-1750)+' كجم':'';
}
function remember(){sessionStorage.setItem(key,JSON.stringify({year,item:item.value,shelf:shelf.value,weight:weight.value,requestId}))}
async function api(path='',body){
 const token=sessionStorage.getItem('jms_auth_token')||'';
 const response=await fetch('/api/ink-count'+path,{cache:'no-store',method:body?'POST':'GET',headers:{...(token?{Authorization:'Bearer '+token}:{}),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
 if(response.status===401){location.replace('/');throw Error()}
 if(!response.ok)throw Error();return response.json();
}
const search=el('search'),results=el('results'),matches=el('matches');
function selectItem(record){
 item.value=record?.id??'';
 el('selected').textContent=record?'الصنف المحدد · '+record.label:'لم يتم اختيار صنف';
}
function closeResults(){
 results.hidden=true;
 search.setAttribute('aria-expanded','false');
 search.value='';
 search.blur();
 validate();
}
function renderMatches(){
 const query=normalize(search.value).toLowerCase();
 const records=items.filter(record=>normalize(record.label).toLowerCase().includes(query));
 matches.replaceChildren(...records.map(record=>{
   const button=document.createElement('button');
   button.type='button';
   button.textContent=record.label;
   button.onclick=()=>{
     selectItem(record);
     requestId='';
     closeResults();
     remember();
     show();
   };
   return button;
 }));
 if(!records.length)matches.textContent='لا يوجد صنف مطابق';
 matches.scrollTop=0;
 results.hidden=false;
 search.setAttribute('aria-expanded','true');
 validate();
}
search.onfocus=renderMatches;
search.oninput=renderMatches;
search.onkeydown=event=>{
 if(event.key==='Escape'){event.preventDefault();closeResults()}
 if(event.key==='Enter'&&matches.childElementCount===1){event.preventDefault();matches.firstElementChild.click()}
};
el('closeSearch').onclick=closeResults;
document.addEventListener('pointerdown',event=>{
 if(!results.hidden&&event.target!==search&&!results.contains(event.target))closeResults();
});
async function show(){
 const id=item.value;el('history').hidden=true;ready=false;validate();if(!id)return;
 try{
 const {entries}=await api('?item='+id);if(item.value!==id)return;
 const sum=entries.reduce((v,x)=>v+x.gross_g-x.tare_g,0);
 el('summary').textContent=entries.length+' عبوة · '+kg(sum)+' كجم صافي';
 el('rows').replaceChildren(...entries.map(x=>{const li=document.createElement('li');li.textContent='رف '+x.shelf+' · الميزان '+kg(x.gross_g)+' · الصافي '+kg(x.gross_g-x.tare_g)+' كجم';return li}));
 el('history').hidden=false;ready=true;validate();
 }catch{status.textContent='تعذر تحميل الجرد. حدّث الصفحة للمحاولة مجددًا.'}
}
for(const input of [shelf,weight])input.oninput=()=>{requestId='';remember();validate()};
el('entry').onsubmit=async e=>{
 e.preventDefault();if(el('save').disabled)return;busy=true;validate();
 for(const input of [weight,item,shelf,el('search')])input.disabled=true;
 requestId||=crypto.randomUUID();remember();
 try{await api('',{id:requestId,item:Number(item.value),year,shelf:shelf.value,grams:grams()});
 weight.value='';requestId='';remember();status.textContent='تم حفظ العبوة';await show();if(!el('manager').hidden)await refreshManager();
 }catch{status.textContent='تعذر تأكيد الحفظ. اضغط حفظ مرة أخرى.'}
 finally{busy=false;for(const input of [weight,item,shelf,el('search')])input.disabled=false;validate();weight.focus()}
};
el('exit').onclick=async()=>{try{await api('',{logout:true});sessionStorage.removeItem(key);location.replace('/')}catch{status.textContent='تعذر الخروج. حاول مجددًا.'}};
function renderManager(data){
 if(!Array.isArray(data.summary))return;
 const names=new Map(data.items.map(x=>[x.id,x.label]));
 let count=0,net=0;
 const rows=data.summary.map(group=>{
   count+=group.count;
   net+=group.net;
   const tr=document.createElement('tr');
   for(const value of [names.get(group.item),group.shelves.join('، '),group.count,kg(group.net)]){
     const td=document.createElement('td');td.textContent=value;tr.append(td);
   }
   return tr;
 });
 el('countLines').replaceChildren(...rows);
 el('totals').textContent=rows.length?'عدد الأصناف '+rows.length+' · عدد العبوات '+count+' · إجمالي الصافي '+kg(net)+' كجم':'لم تُسجّل عبوات في هذا الجرد بعد';
 el('manager').hidden=false;
}
async function refreshManager(){
 el('refresh').disabled=true;
 try{renderManager(await api());status.textContent='جرد '+year}
 catch{status.textContent='تعذر تحديث الكشف. حاول مرة أخرى.'}
 finally{el('refresh').disabled=false}
}
function exportWorkbook(data){
 const names=new Map(data.items.map(item=>[item.id,item.label]));
 const rows=[['الصنف','الرفوف','عدد العبوات','صافي الحبر (كجم)']];
 let cans=0,grams=0;
 for(const group of data.summary){
   rows.push([names.get(group.item),group.shelves.join('، '),group.count,group.net/1000]);
   cans+=group.count;
   grams+=group.net;
 }
 rows.push(['الإجمالي','',cans,grams/1000]);
 const sheet=XLSX.utils.aoa_to_sheet(rows);
 sheet['!cols']=[{wch:55},{wch:20},{wch:15},{wch:22}];
 for(let row=2;row<=rows.length;row++)sheet['D'+row].z='0.000';
 const book=XLSX.utils.book_new();
 book.Workbook={Views:[{RTL:true}]};
 XLSX.utils.book_append_sheet(book,sheet,'جرد '+data.year);
 XLSX.writeFile(book,'جرد-الأحبار-'+data.year+'.xlsx');
}
el('exportCount').onclick=async()=>{
 const button=el('exportCount');
 button.disabled=true;
 try{
   const data=await api();
   if(!Array.isArray(data.summary))throw Error();
   renderManager(data);
   exportWorkbook(data);
 }catch{status.textContent='تعذر تحميل ملف إكسل. حاول مرة أخرى.'}
 finally{button.disabled=false}
};
el('refresh').onclick=refreshManager;
try{const data=await api();year=data.year;items=data.items;renderManager(data);
 const draft=JSON.parse(sessionStorage.getItem(key)||'{}');const d=draft.year===year?draft:{};
 selectItem(items.find(record=>String(record.id)===String(d.item)));shelf.value=d.shelf||'';weight.value=d.weight||'';requestId=d.requestId||'';
 status.textContent='جرد '+year;el('panel').hidden=false;await show();
}catch{status.textContent='تعذر فتح الجرد. تحقق من الاتصال وصلاحية الحساب.'}
</script></html>
