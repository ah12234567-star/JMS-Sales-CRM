<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JMS Production</title><meta name="theme-color" content="#0f172a">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Cairo,Arial,sans-serif;background:#f4f7fb;color:#0f172a}.top{position:sticky;top:0;z-index:20;background:#0f172a;color:white;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:10px}.brand b{display:block}.brand small{color:#94a3b8}.net{padding:6px 10px;border-radius:999px;font-size:11px;font-weight:800;background:#dcfce7;color:#166534}.net.off{background:#fee2e2;color:#991b1b}.wrap{max-width:1180px;margin:auto;padding:12px 10px 80px}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 10px}.tab{border:0;border-radius:13px;padding:10px 14px;background:white;font-weight:800;white-space:nowrap}.tab.active{background:#ef4444;color:white}.view{display:none}.view.active{display:block}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi,.card{background:#fff;border:1px solid #e2e8f0;border-radius:17px;padding:12px;box-shadow:0 5px 18px #0f172a0c}.kpi span{display:block;color:#64748b;font-size:11px}.kpi b{font-size:24px}.search{margin:10px 0}.search input{width:100%;border:1px solid #cbd5e1;border-radius:14px;padding:13px;font:inherit;background:white}.order{margin-bottom:9px}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.mo{font-weight:900}.muted{color:#64748b;font-size:12px}.badge{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900;background:#dbeafe;color:#1d4ed8}.prog{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:9px 0}.prog i{height:100%;display:block;background:#ef4444}.route{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.stage{padding:7px 4px;border-radius:10px;background:#f1f5f9;text-align:center;font-size:10px;font-weight:800}.stage.done{background:#dcfce7;color:#166534}.stage.now{background:#fee2e2;color:#b91c1c}.field{padding:11px;margin-bottom:9px}.field h3{margin:0 0 2px;font-size:16px}.batch{margin:8px 0;padding:8px 10px;border-radius:12px;background:#f8fafc;border:1px dashed #94a3b8;display:flex;justify-content:space-between;font-size:12px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.input{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:8px}.input label{display:block;color:#64748b;font-size:10px}.input input,.input select{width:100%;border:0;background:transparent;outline:0;font:inherit;font-size:15px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.btn{border:0;border-radius:13px;padding:12px 8px;font:inherit;font-weight:900}.dark{background:#0f172a;color:white}.green{background:#16a34a;color:white}.soft{background:#e2e8f0;color:#334155}.danger{background:#dc2626;color:white}.empty{text-align:center;padding:28px;color:#64748b}.toast{position:fixed;bottom:16px;right:16px;left:16px;max-width:520px;margin:auto;background:#0f172a;color:white;padding:12px;border-radius:13px;display:none;z-index:40}.toast.show{display:block}.login{max-width:520px;margin:70px auto;background:white;padding:20px;border-radius:18px;text-align:center}.compact .input{padding:6px 8px}.compact .form{gap:6px}.compact .actions{margin-top:7px}.compact .batch{margin:6px 0}.compact{padding:9px}.packs{border-color:#cbd5e1}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.wrap{padding:9px 8px 72px}.route{grid-template-columns:repeat(4,1fr)}.field{border-radius:14px}.compact .input input,.compact .input select{font-size:14px}.compact .input label{font-size:9px}}
</style></head><body>
<header class="top"><div class="brand"><b>JMS Production</b><small>التصنيع والإنتاج</small></div><span id="net" class="net">متصل</span></header>
<div id="authGate" class="login" hidden><h2>يلزم تسجيل الدخول</h2><p>افتح النظام الرئيسي وسجل الدخول ثم ارجع إلى شاشة الإنتاج.</p><button class="btn dark" onclick="location.href='/'">العودة للنظام</button></div>
<main id="app" class="wrap" hidden>
<div class="tabs"><button class="tab active" data-v="dashboard">لوحة الإدارة</button><button class="tab" data-v="mixing">الخلطة</button><button class="tab" data-v="extrusion">السحب</button><button class="tab" data-v="printing">الطباعة</button><button class="tab" data-v="cutting">القص</button></div>
<section id="dashboard" class="view active"><div class="kpis"><div class="kpi"><span>إجمالي الأوامر</span><b id="kTotal">0</b></div><div class="kpi"><span>قيد الإنتاج</span><b id="kProgress">0</b></div><div class="kpi"><span>متوسط الإنجاز</span><b id="kAvg">0%</b></div><div class="kpi"><span>جاهز بالمخزون</span><b id="kStock">0</b><small>كجم</small></div></div><div class="search"><input id="search" placeholder="بحث سريع برقم MO أو اسم العميل" oninput="renderDashboard()"></div><div id="orders"></div></section>
<section id="mixing" class="view"><div id="mixingList"></div></section>
<section id="extrusion" class="view"><div id="extrusionList"></div></section>
<section id="printing" class="view"><div id="printingList"></div></section>
<section id="cutting" class="view"><div id="cuttingList"></div></section>
</main><div id="toast" class="toast"></div>
<script>
const token=sessionStorage.getItem('jms_auth_token');let DATA={summary:{},orders:[]};
const names={mixing:'الخلطة',extrusion:'السحب',printing:'الطباعة',cutting:'القص'};
function headers(){return {'Content-Type':'application/json','Authorization':'Bearer '+token}}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers(),...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||j.error||('HTTP '+r.status));return j}
async function load(){try{const j=await api('/api/manufacturing-dashboard');DATA=j;renderAll()}catch(e){toast('تعذر تحميل الإنتاج: '+e.message)}}
function pct(o){return Math.round(Number(o.progress_percent||0))}
function cur(o){return (o.operations||[]).find(x=>['ready','in_progress'].includes(x.status))||(o.operations||[]).find(x=>x.status==='waiting')}
function customer(o){return o.data?.customer_name||o.product_spec?.customer_name||o.customer_name||o.customer_id||'-'}
function stageHtml(o){return (o.operations||[]).map(op=>`<div class="stage ${op.status==='completed'?'done':(['ready','in_progress'].includes(op.status)?'now':'')}">${op.status==='completed'?'✓ ':''}${names[op.work_center]||op.work_center}</div>`).join('')}
function renderDashboard(){const s=DATA.summary||{};kTotal.textContent=s.total||0;kProgress.textContent=s.in_progress||0;kAvg.textContent=(s.avg_progress||0)+'%';kStock.textContent=Number(s.ready_stock_kg||0).toLocaleString('ar-SA');const q=(search.value||'').trim().toLowerCase();let list=(DATA.orders||[]).filter(o=>!q||String(o.order_no||'').toLowerCase().includes(q)||String(customer(o)).toLowerCase().includes(q));orders.innerHTML=list.length?list.map(o=>{let c=cur(o);return `<div class="card order"><div class="row"><div><div class="mo">${o.order_no}</div><div class="muted">${customer(o)}</div></div><span class="badge">${c?names[c.work_center]||c.work_center:o.status}</span></div><div class="prog"><i style="width:${pct(o)}%"></i></div><div class="row muted"><span>${pct(o)}%</span><span>${Number(o.planned_qty_kg||0).toLocaleString('ar-SA')} كجم</span></div><div class="route">${stageHtml(o)}</div></div>`}).join(''):'<div class="empty">لا توجد أوامر مطابقة</div>'}
function opOrders(center){return (DATA.orders||[]).filter(o=>(o.operations||[]).some(x=>x.work_center===center&&['ready','in_progress'].includes(x.status)))}
function batchNo(o,op){return op.batch_id||(`${centerPrefix(op.work_center)}-${String(o.order_no||o.id).replace(/[^A-Za-z0-9-]/g,'')}-${Date.now().toString().slice(-5)}`)}
function centerPrefix(c){return {mixing:'MIX',extrusion:'FILM',printing:'PRINT',cutting:'FG'}[c]||'BATCH'}
function fieldCard(o,op){let incoming=(o.operations||[]).filter(x=>x.seq<op.seq&&x.batch_id).sort((a,b)=>b.seq-a.seq)[0];let compact=op.work_center==='extrusion'?' compact':'';let f='';
if(op.work_center==='mixing')f=`<div class="form"><div class="input"><label>لوط الخام</label><select id="lot-${op.id}"><option value="">اختر من المخزون</option></select></div><div class="input"><label>الكمية المصروفة كجم</label><input id="consume-${op.id}" inputmode="decimal"></div><div class="input"><label>الوزن الناتج كجم</label><input id="outkg-${op.id}" inputmode="decimal"></div><div class="input"><label>الهدر كجم</label><input id="waste-${op.id}" inputmode="decimal" value="0"></div></div>`;
if(op.work_center==='extrusion')f=`<div class="form"><div class="input"><label>الماكينة</label><input id="machine-${op.id}" placeholder="EX-01"></div><div class="input"><label>العرض سم</label><input id="width-${op.id}" inputmode="decimal"></div><div class="input"><label>السماكة ميكرون</label><input id="micron-${op.id}" inputmode="decimal"></div><div class="input"><label>وزن الفلم كجم</label><input id="outkg-${op.id}" inputmode="decimal"></div><div class="input"><label>هدر الفلم كجم</label><input id="waste-${op.id}" inputmode="decimal" value="0"></div><div class="input"><label>Batch الناتج</label><input id="batch-${op.id}" value="${batchNo(o,op)}"></div></div>`;
if(op.work_center==='printing')f=`<div class="form"><div class="input"><label>عدد الألوان</label><input id="colors-${op.id}" inputmode="numeric"></div><div class="input"><label>وجه الطباعة</label><select id="face-${op.id}"><option>وجه واحد</option><option>وجهين</option></select></div><div class="input"><label>السلندر 1</label><input id="c1-${op.id}"></div><div class="input"><label>السلندر 2</label><input id="c2-${op.id}"></div><div class="input"><label>الوزن الناتج كجم</label><input id="outkg-${op.id}" inputmode="decimal"></div><div class="input"><label>الهدر كجم</label><input id="waste-${op.id}" inputmode="decimal" value="0"></div></div>`;
if(op.work_center==='cutting')f=`<div class="form"><div class="input"><label>الوزن النهائي كجم</label><input id="outkg-${op.id}" inputmode="decimal"></div><div class="input"><label>عدد الأكياس</label><input id="pcs-${op.id}" inputmode="numeric"></div><div class="input packs"><label>عدد الشدات / الكراتين (اختياري)</label><input id="packs-${op.id}" inputmode="numeric"></div><div class="input"><label>هدر القص كجم</label><input id="waste-${op.id}" inputmode="decimal" value="0"></div></div>`;
return `<div class="card field${compact}"><div class="row"><div><h3>${o.order_no} — ${names[op.work_center]}</h3><div class="muted">${customer(o)} · ${Number(o.planned_qty_kg||0).toLocaleString('ar-SA')} كجم</div></div><span class="badge">${op.status==='in_progress'?'قيد العمل':'جاهز'}</span></div><div class="batch"><span>${incoming?'Batch الوارد':'Batch ID'}</span><b>${incoming?incoming.batch_id:(op.batch_id||'سيُنشأ عند الإتمام')}</b></div>${f}<div class="actions"><button class="btn dark" onclick="startOp('${op.id}')">بدء المرحلة</button><button class="btn green" onclick="completeOp('${o.id}','${op.id}','${op.work_center}')">إتمام وتسليم</button></div></div>`}
async function loadLots(){try{let j=await api('/api/manufacturing-material');document.querySelectorAll('select[id^="lot-"]').forEach(s=>{s.innerHTML='<option value="">اختر من المخزون</option>'+j.lots.map(x=>`<option value="${x.id}" data-code="${x.material_code}">${x.material_code} · ${x.lot_no||'-'} · ${Number(x.qty_kg).toLocaleString('ar-SA')} كجم</option>`).join('')})}catch(e){}}
function renderCenters(){['mixing','extrusion','printing','cutting'].forEach(c=>{let el=document.getElementById(c+'List'),list=opOrders(c);el.innerHTML=list.length?list.map(o=>fieldCard(o,(o.operations||[]).find(x=>x.work_center===c&&['ready','in_progress'].includes(x.status)))).join(''):'<div class="empty">لا توجد أوامر جاهزة لهذا القسم</div>'});loadLots()}
function renderAll(){renderDashboard();renderCenters()}
async function startOp(id){try{await api('/api/manufacturing-operation',{method:'POST',body:JSON.stringify({operation_id:id,action:'start'})});toast('تم بدء المرحلة');await load()}catch(e){toast('تعذر البدء: '+e.message)}}
const val=id=>document.getElementById(id)?.value||'';
async function completeOp(orderId,opId,center){try{let actual={},outputKg=Number(val('outkg-'+opId)||0),outputPcs=Number(val('pcs-'+opId)||0),waste=Number(val('waste-'+opId)||0),wasteType={mixing:'raw_material',extrusion:'film',printing:'ink',cutting:'cutting'}[center],batch=val('batch-'+opId)||`${centerPrefix(center)}-${Date.now()}`;
if(center==='mixing'){let s=document.getElementById('lot-'+opId),lot=s?.value,qty=Number(val('consume-'+opId)||0);if(lot&&qty>0){let code=s.options[s.selectedIndex].dataset.code;await api('/api/manufacturing-material',{method:'POST',body:JSON.stringify({manufacturing_order_id:orderId,operation_id:opId,inventory_lot_id:lot,material_code:code,qty_kg:qty,client_event_id:'ui-mat-'+Date.now(),attributes:{source:'production-ui'}})});actual.consumed_kg=qty;actual.material_code=code}}
if(center==='extrusion')actual={machine_id:val('machine-'+opId),width_cm:Number(val('width-'+opId)||0),micron:Number(val('micron-'+opId)||0)};
if(center==='printing')actual={colors:Number(val('colors-'+opId)||0),print_face:val('face-'+opId),cylinders:[val('c1-'+opId),val('c2-'+opId)].filter(Boolean)};
if(center==='cutting')actual={packs_or_cartons:Number(val('packs-'+opId)||0)};
await api('/api/manufacturing-operation',{method:'POST',body:JSON.stringify({operation_id:opId,action:'complete',actual,output_kg:outputKg,output_pcs:outputPcs,waste_kg:waste,waste_type:wasteType,batch_no:batch,client_event_id:'ui-op-'+Date.now()})});toast('تم إتمام المرحلة بنجاح');await load()}catch(e){toast('تعذر الإتمام: '+e.message)}}
function net(){document.getElementById('net').textContent=navigator.onLine?'متصل':'بدون إنترنت';document.getElementById('net').classList.toggle('off',!navigator.onLine)}window.addEventListener('online',()=>{net();load()});window.addEventListener('offline',net);net();
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.v).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})});
if(!token){authGate.hidden=false}else{app.hidden=false;load()}
</script></body></html>
