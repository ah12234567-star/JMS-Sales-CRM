<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JMS Production</title>
<meta name="theme-color" content="#0f172a">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#0f172a}.top{position:sticky;top:0;z-index:20;background:#0f172a;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1180px;margin:auto;padding:12px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.tab{border:0;border-radius:13px;padding:11px 15px;background:#fff;font-weight:900;white-space:nowrap}.tab.active{background:#ef4444;color:#fff}.view{display:none}.view.active{display:block}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 5px 18px #0f172a0b}.order-card{cursor:pointer}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.mo{font-weight:900;font-size:18px}.muted{color:#64748b;font-size:12px}.badge{padding:6px 9px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:11px;font-weight:900}.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.spec{background:#f8fafc;border-radius:12px;padding:9px}.spec b{display:block;font-size:13px}.spec small{color:#64748b}.machine-select,.weight-grid,.mix-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.field{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:9px}.field label{display:block;font-size:11px;color:#64748b}.field input,.field select{width:100%;border:0;background:transparent;outline:0;font:inherit;font-size:18px;font-weight:900;padding:5px 0}.big{width:100%;border:0;border-radius:15px;padding:15px;font:inherit;font-weight:900;font-size:17px;cursor:pointer}.primary{background:#0f172a;color:#fff}.green{background:#16a34a;color:#fff}.blue{background:#2563eb;color:#fff}.soft{background:#e2e8f0}.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.total{background:#eff6ff;border-radius:12px;padding:10px;text-align:center}.total b{display:block;font-size:20px}.movements{overflow:auto}.movements table{width:100%;border-collapse:collapse}.movements th,.movements td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:center}.search input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:14px;font:inherit}.empty{text-align:center;color:#64748b;padding:30px}.back{border:0;background:#e2e8f0;border-radius:12px;padding:9px 12px;font-weight:900;cursor:pointer}.net{font-size:11px;padding:6px 9px;border-radius:999px;background:#dcfce7;color:#166534}.net.off{background:#fee2e2;color:#991b1b}.adminlink{color:#fff;font-size:12px;text-decoration:none;border:1px solid #334155;padding:6px 9px;border-radius:10px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{background:#fff;border-radius:16px;padding:12px}.kpi small{color:#64748b}.kpi b{display:block;font-size:24px}.section-title{font-weight:900;margin:16px 0 8px}.hint{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:13px;padding:10px;margin-top:10px;font-size:12px}.toast{position:fixed;bottom:20px;left:15px;right:15px;max-width:500px;margin:auto;background:#0f172a;color:#fff;padding:12px;border-radius:13px;display:none;z-index:40}.toast.show{display:block}
@media(max-width:760px){.wrap{padding:9px}.specs{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}.order-card{padding:15px}.machine-select,.weight-grid,.mix-grid{grid-template-columns:1fr}.field input,.field select{font-size:20px;min-height:38px}.big{padding:18px;font-size:19px}.movements table{font-size:12px}.top{padding:12px 10px}.adminlink{display:none}}
@media(min-width:761px){.orders-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.order-card{margin:0}.detail-card{padding:18px}}
</style>
</head>
<body>
<header class="top"><div><b>JMS Production</b><div class="muted" style="color:#94a3b8">التصنيع والإنتاج</div></div><div style="display:flex;gap:7px;align-items:center"><a class="adminlink" href="/production-machines.html">إدارة المكائن</a><span id="net" class="net">متصل</span></div></header>
<main class="wrap"><div class="tabs"><button class="tab active" data-v="dashboard">الإدارة</button><button class="tab" data-v="mixing">الخلطة</button><button class="tab" data-v="extrusion">الفلم</button><button class="tab" data-v="printing">الطباعة</button><button class="tab" data-v="cutting">القص</button></div>
<section id="dashboard" class="view active"><div class="kpis"><div class="kpi"><small>الأوامر</small><b id="kTotal">0</b></div><div class="kpi"><small>قيد الإنتاج</small><b id="kProgress">0</b></div><div class="kpi"><small>متوسط الإنجاز</small><b id="kAvg">0%</b></div><div class="kpi"><small>جاهز كجم</small><b id="kStock">0</b></div></div><div class="search" style="margin:10px 0"><input id="search" placeholder="بحث برقم MO أو العميل"></div><div id="orders" class="orders-grid"></div></section>
<section id="mixing" class="view"><div id="mixingList"></div></section><section id="extrusion" class="view"><div id="extrusionList"></div></section><section id="printing" class="view"><div id="printingList"></div></section><section id="cutting" class="view"><div id="cuttingList"></div></section></main><div id="toast" class="toast"></div>
<script>
let token=sessionStorage.getItem('jms_auth_token')||localStorage.getItem('jms_auth_token')||'';let DATA={summary:{},orders:[]},MACHINES=[],loading=false,lastLoaded=0;const names={mixing:'الخلطة',extrusion:'الفلم',printing:'الطباعة',cutting:'القص'};const toastEl=document.getElementById('toast');function H(){return {'Content-Type':'application/json','Authorization':'Bearer '+token}}function toast(s){toastEl.textContent=s;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),2800)}async function api(u,o={}){const sep=u.includes('?')?'&':'?';const r=await fetch(u+sep+'_ts='+Date.now(),{cache:'no-store',...o,headers:{...H(),...(o.headers||{})}});const j=await r.json().catch(()=>({}));if(r.status===401){location.href='/';throw new Error('انتهت الجلسة')}if(!r.ok)throw new Error(j.message||j.error||('HTTP '+r.status));return j}
async function load(force=false){if(!token||loading||!navigator.onLine)return;if(!force&&Date.now()-lastLoaded<1200)return;loading=true;try{const [d,m]=await Promise.all([api('/api/manufacturing-dashboard'),api('/api/manufacturing-machines?active=true')]);DATA=d;MACHINES=m.machines||[];lastLoaded=Date.now();renderAll()}catch(e){toast('تعذر التحديث: '+e.message)}finally{loading=false}}
function customer(o){return o.data?.customer_name||o.product_spec?.customer_name||o.customer_name||o.customer_id||'-'}function specs(o){const p=o.product_spec||{};return {size:p.size||[p.width_cm,p.length_cm].filter(Boolean).join('×')||'-',material:p.material||p.material_type||'-',color:p.color||'-',micron:p.micron||p.thickness||'-',cylinder:p.cylinder||p.cylinder_size||'-',print:p.printing||p.print_type||'-'}}function specHtml(p){return `<div class="specs"><div class="spec"><small>المقاس</small><b>${p.size}</b></div><div class="spec"><small>الخامة</small><b>${p.material}</b></div><div class="spec"><small>اللون</small><b>${p.color}</b></div><div class="spec"><small>السماكة</small><b>${p.micron}</b></div><div class="spec"><small>السلندر</small><b>${p.cylinder}</b></div><div class="spec"><small>الطباعة</small><b>${p.print}</b></div></div>`}
function renderDashboard(){const s=DATA.summary||{};kTotal.textContent=s.total||0;kProgress.textContent=s.in_progress||0;kAvg.textContent=(s.avg_progress||0)+'%';kStock.textContent=Number(s.ready_stock_kg||0).toLocaleString('ar-SA');const q=(search.value||'').toLowerCase();const list=(DATA.orders||[]).filter(o=>!q||String(o.order_no||'').toLowerCase().includes(q)||String(customer(o)).toLowerCase().includes(q));orders.innerHTML=list.length?list.map(o=>`<div class="card order-card"><div class="row"><div><div class="mo">${o.order_no}</div><div class="muted">${customer(o)}</div></div><span class="badge">${Math.round(Number(o.progress_percent||0))}%</span></div><div class="muted">${Number(o.planned_qty_kg||0).toLocaleString('ar-SA')} كجم</div></div>`).join(''):'<div class="empty">لا توجد أوامر</div>'}
function activeOrders(c){return (DATA.orders||[]).filter(o=>(o.operations||[]).some(x=>x.work_center===c&&['ready','in_progress'].includes(x.status)))}function opFor(o,c){return (o.operations||[]).find(x=>x.work_center===c&&['ready','in_progress'].includes(x.status))}function machineOptions(c,selected=''){return '<option value="">اختر الماكينة النشطة</option>'+MACHINES.filter(m=>m.work_center===c&&m.active).map(m=>`<option value="${m.id}" ${m.id===selected?'selected':''}>${m.display_name}</option>`).join('')}function orderCard(o,c){const op=opFor(o,c),p=specs(o),click=c==='mixing'?`openMix('${o.id}')`:`openOrder('${o.id}','${c}')`;return `<div class="card order-card" onclick="${click}"><div class="row"><div><div class="mo">${o.order_no}</div><div class="muted">${customer(o)}</div></div><span class="badge">${op.status==='in_progress'?'قيد العمل':'جاهز'}</span></div><div class="specs"><div class="spec"><small>المقاس</small><b>${p.size}</b></div><div class="spec"><small>الخامة</small><b>${p.material}</b></div><div class="spec"><small>اللون</small><b>${p.color}</b></div><div class="spec"><small>الكمية</small><b>${Number(o.planned_qty_kg||0).toLocaleString('ar-SA')} كجم</b></div></div></div>`}function renderCenters(){['mixing','extrusion','printing','cutting'].forEach(c=>{const el=document.getElementById(c+'List'),list=activeOrders(c);el.innerHTML=list.length?'<div class="orders-grid">'+list.map(o=>orderCard(o,c)).join('')+'</div>':'<div class="empty">لا توجد أوامر جاهزة لهذا القسم</div>'})}function renderAll(){renderDashboard();renderCenters()}
window.openMix=async function(orderId){const o=(DATA.orders||[]).find(x=>x.id===orderId),op=opFor(o,'mixing'),p=specs(o),el=mixingList;if(!o||!op)return;el.innerHTML=`<button class="back" onclick="renderCenters()">رجوع للأوامر</button><div class="card detail-card"><div class="row"><div><div class="mo">${o.order_no}</div><div class="muted">${customer(o)}</div></div><span class="badge">الخلطة</span></div>${specHtml(p)}<div class="section-title">صرف المواد الخام</div><div class="mix-grid"><div class="field"><label>اللوت / التشغيلة</label><select id="lot-${op.id}"><option>جاري التحميل...</option></select></div><div class="field"><label>الكمية المصروفة كجم</label><input id="qty-${op.id}" inputmode="decimal" placeholder="0.000"></div></div><button class="big blue" style="margin-top:10px" onclick="consumeMaterial('${o.id}','${op.id}')">+ إضافة مادة للخلطة</button><div id="materialTotals-${op.id}" class="totals"></div><div id="materials-${op.id}" class="movements"></div><div class="section-title">إتمام الخلطة</div><div class="weight-grid"><div class="field"><label>وزن الخلطة النهائي كجم</label><input id="mixout-${op.id}" inputmode="decimal" placeholder="0.000"></div><div class="field"><label>الهدر / Scrap كجم</label><input id="mixwaste-${op.id}" inputmode="decimal" placeholder="0.000"></div></div><div class="hint">سيتم توليد Batch ID تلقائياً وربطه بمرحلة الفلم عند إتمام الخلطة.</div><button class="big green" style="margin-top:10px" onclick="completeMix('${o.id}','${op.id}')">إتمام الخلطة وإرسال للفلم</button></div>`;await loadMaterials(op.id)}
async function loadMaterials(opId){try{const j=await api('/api/manufacturing-material?operation_id='+encodeURIComponent(opId));const select=document.getElementById('lot-'+opId);if(select)select.innerHTML='<option value="">اختر اللوت</option>'+(j.lots||[]).map(l=>`<option value="${l.id}" data-code="${l.material_code}">${l.material_name||l.material_code} · ${l.lot_no||'بدون لوت'} · متاح ${Number(l.qty_kg||0).toFixed(3)} كجم</option>`).join('');const total=Number(j.total_consumed_kg||0),totals=document.getElementById('materialTotals-'+opId);if(totals){totals.dataset.total=String(total);totals.innerHTML=`<div class="total"><small>إجمالي الخام المصروف</small><b>${total.toFixed(3)}</b></div><div class="total"><small>عدد الحركات</small><b>${(j.moves||[]).length}</b></div><div class="total"><small>الحالة</small><b>${total>0?'جاهزة للإتمام':'بانتظار الصرف'}</b></div>`}const moves=document.getElementById('materials-'+opId);if(moves)moves.innerHTML=(j.moves||[]).length?`<table><thead><tr><th>المادة</th><th>اللوت</th><th>الكمية كجم</th></tr></thead><tbody>${j.moves.map(m=>`<tr><td>${m.material_code}</td><td>${m.lot_no||'-'}</td><td>${Number(m.qty_kg||0).toFixed(3)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">لم يتم صرف مواد لهذه الخلطة بعد</div>'}catch(e){toast('تعذر تحميل الخامات: '+e.message)}}
window.consumeMaterial=async function(orderId,opId){const sel=document.getElementById('lot-'+opId),opt=sel?.selectedOptions?.[0],qty=Number(document.getElementById('qty-'+opId)?.value||0);if(!sel?.value)return toast('اختر اللوت');if(!(qty>0))return toast('أدخل كمية الصرف');try{await api('/api/manufacturing-operation',{method:'POST',body:JSON.stringify({operation_id:opId,action:'start'})});await api('/api/manufacturing-material',{method:'POST',body:JSON.stringify({manufacturing_order_id:orderId,operation_id:opId,inventory_lot_id:sel.value,material_code:opt.dataset.code,qty_kg:qty,client_event_id:'mixmat-'+Date.now(),attributes:{source:'production-ui'}})});document.getElementById('qty-'+opId).value='';toast('تم خصم المادة من المخزون');await loadMaterials(opId);await load(true)}catch(e){toast('تعذر صرف المادة: '+e.message)}}
window.completeMix=async function(orderId,opId){const output=Number(document.getElementById('mixout-'+opId)?.value||0),waste=Number(document.getElementById('mixwaste-'+opId)?.value||0),consumed=Number(document.getElementById('materialTotals-'+opId)?.dataset.total||0);if(!(consumed>0))return toast('يجب صرف مادة خام واحدة على الأقل');if(!(output>0))return toast('أدخل وزن الخلطة النهائي');if(waste<0)return toast('قيمة الهدر غير صحيحة');try{const j=await api('/api/manufacturing-operation',{method:'POST',body:JSON.stringify({operation_id:opId,action:'complete',output_kg:output,waste_kg:waste,waste_type:'raw_material',client_event_id:'mixcomplete-'+Date.now(),actual:{total_consumed_kg:consumed,source:'production-ui'}})});toast('تمت الخلطة · Batch: '+(j.batch_no||j.batch_id||'تم التوليد'));await load(true);activateTab('extrusion')}catch(e){toast('تعذر إتمام الخلطة: '+e.message)}}
window.openOrder=async function(orderId,c){const o=(DATA.orders||[]).find(x=>x.id===orderId),op=opFor(o,c),p=specs(o),el=document.getElementById(c+'List');if(!o||!op)return;el.innerHTML=`<button class="back" onclick="renderCenters()">رجوع للأوامر</button><div class="card detail-card"><div class="row"><div><div class="mo">${o.order_no}</div><div class="muted">${customer(o)}</div></div><span class="badge">${names[c]}</span></div>${specHtml(p)}<div class="machine-select"><div class="field"><label>الماكينة</label><select id="machine-${op.id}">${machineOptions(c,op.assigned_machine_id||'')}</select></div><div class="field"><label>Batch ID</label><input value="${op.batch_id||'-'}" readonly></div></div><div class="weight-grid"><div class="field"><label>وزن الرول</label><input id="gross-${op.id}" inputmode="decimal" placeholder="0.000"></div><div class="field"><label>وزن الماصورة</label><input id="tube-${op.id}" inputmode="decimal" placeholder="0.000"></div></div><button class="big green" style="margin-top:10px" onclick="addMove('${op.id}','${o.id}','${c}')">+ إضافة رول / تسجيل حركة</button><div id="totals-${op.id}" class="totals"></div><div id="moves-${op.id}" class="movements"></div></div>`;await loadMoves(op.id,o)}
window.addMove=async function(opId,orderId,c){const machine=document.getElementById('machine-'+opId).value,gross=Number(document.getElementById('gross-'+opId).value||0),tube=Number(document.getElementById('tube-'+opId).value||0);if(!machine)return toast('اختر الماكينة أولاً');if(gross<=0)return toast('أدخل وزن الرول');try{const j=await api('/api/manufacturing-movements',{method:'POST',body:JSON.stringify({operation_id:opId,machine_id:machine,gross_kg:gross,tube_kg:tube,client_event_id:'field-'+Date.now(),attributes:{source:'production-ui',work_center:c}})});document.getElementById('gross-'+opId).value='';document.getElementById('tube-'+opId).value='';toast('تم تسجيل الرول رقم '+j.roll_no);await loadMoves(opId,(DATA.orders||[]).find(x=>x.id===orderId));await load(true)}catch(e){toast('تعذر التسجيل: '+e.message)}}
async function loadMoves(opId,o){try{const j=await api('/api/manufacturing-movements?operation_id='+encodeURIComponent(opId)),planned=Number(o?.planned_qty_kg||0),net=Number(j.total_net_kg||0),remaining=Math.max(0,planned-net);document.getElementById('totals-'+opId).innerHTML=`<div class="total"><small>الصافي</small><b>${net.toFixed(3)}</b></div><div class="total"><small>المتبقي</small><b>${remaining.toFixed(3)}</b></div><div class="total"><small>الرولات</small><b>${j.movements.length}</b></div>`;document.getElementById('moves-'+opId).innerHTML=j.movements.length?`<table><thead><tr><th>الرول</th><th>الوزن</th><th>الماسورة</th><th>الصافي</th></tr></thead><tbody>${j.movements.map(m=>`<tr><td>${m.roll_no}</td><td>${Number(m.gross_kg).toFixed(3)}</td><td>${Number(m.tube_kg).toFixed(3)}</td><td>${Number(m.net_kg).toFixed(3)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">لم يتم تسجيل رولات بعد</div>'}catch(e){document.getElementById('moves-'+opId).innerHTML='<div class="empty">تعذر تحميل الحركات</div>'}}
function activateTab(v){document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('active'));const b=document.querySelector(`.tab[data-v="${v}"]`);if(b)b.classList.add('active');const view=document.getElementById(v);if(view)view.classList.add('active');renderCenters();load(true)}function netState(){net.textContent=navigator.onLine?'متصل':'بدون إنترنت';net.classList.toggle('off',!navigator.onLine)}search.addEventListener('input',renderDashboard);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>activateTab(b.dataset.v));window.addEventListener('online',()=>{netState();load(true)});window.addEventListener('offline',netState);window.addEventListener('pageshow',()=>load(true));document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load(true)});if(!token)location.href='/';else{netState();load(true);setInterval(()=>{if(document.visibilityState==='visible'&&navigator.onLine)load(false)},30000)}
</script>

</body></html>
