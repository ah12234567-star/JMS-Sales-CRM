<!doctype html><html data-account-page lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="ui_9579905d7c32">إدارة مكائن الإنتاج</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#0f172a}.top{background:#0f172a;color:#fff;padding:16px;position:sticky;top:0}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}input,select,button{font:inherit;border:1px solid #cbd5e1;border-radius:12px;padding:11px;width:100%}button{font-weight:800;cursor:pointer}.primary{background:#0f172a;color:#fff}.green{background:#16a34a;color:#fff}.danger{background:#fee2e2;color:#991b1b}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.tab{width:auto;white-space:nowrap}.tab.active{background:#2563eb;color:#fff}.machine{display:grid;grid-template-columns:80px 1.5fr 1fr 1fr 110px 110px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #e2e8f0}.status{font-weight:800}.on{color:#166534}.off{color:#991b1b}.muted{color:#64748b;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.machine{grid-template-columns:1fr 1fr}.machine>*{min-width:0}.machine .name{grid-column:1/-1;font-weight:900}.wrap{padding:9px}}</style><link rel="stylesheet" href="/localization.css?v=20261111-1"><script defer src="/localization.js?v=20261111-1"></script></head><body><div class="top"><b data-i18n="ui_9579905d7c32">إدارة مكائن الإنتاج</b></div><main class="wrap"><div class="card"><h3 data-i18n="ui_320d94048bdb">إضافة ماكينة</h3><div class="grid"><select id="center"><option value="extrusion" data-i18n="ui_5926ff6ac41f">السحب / الفلم</option><option value="printing" data-i18n="ui_770a398a4d19">الطباعة</option><option value="cutting" data-i18n="ui_0b6c823f06cd">القص</option></select><input id="name" placeholder="اسم الماكينة" data-i18n-placeholder="ui_fc9264430a7b"><input id="code" placeholder="الكود" data-i18n-placeholder="ui_e28ef005ab68"><input id="no" inputmode="numeric" placeholder="رقم الماكينة" data-i18n-placeholder="ui_b2e50423994e"><button class="green" onclick="addMachine()" data-i18n="ui_d52453ac627d">إضافة</button></div></div><div class="tabs"><button class="tab active" data-c="" data-i18n="ui_65f276da33cf">الكل</button><button class="tab" data-c="extrusion" data-i18n="ui_40ebd24b39c2">الفلم</button><button class="tab" data-c="printing" data-i18n="ui_770a398a4d19">الطباعة</button><button class="tab" data-c="cutting" data-i18n="ui_0b6c823f06cd">القص</button></div><div id="list" class="card"></div></main><script>let token=sessionStorage.getItem('jms_auth_token')||localStorage.getItem('jms_auth_token')||'',filter='';function H(){return {'Content-Type':'application/json','Authorization':'Bearer '+token}}async function api(u,o={}){let r=await fetch(u+(u.includes('?')?'&':'?')+'_ts='+Date.now(),{cache:'no-store',...o,headers:{...H(),...(o.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||j.error);return j}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){try{let q=filter?'?work_center='+filter:'';let j=await api('/api/manufacturing-machines'+q);list.innerHTML=j.machines.length?j.machines.map(m=>`<div class="machine"><div>${m.machine_no??'-'}</div><div class="name"><input id="n-${m.id}" value="${esc(m.display_name)}"><div class="muted">${esc(m.code)} · ${m.work_center}</div></div><div><input id="cap-${m.id}" value='${esc(JSON.stringify(m.capabilities||{}))}'></div><div class="status ${m.active?'on':'off'}">${m.active?'تعمل':'صيانة'}</div><button onclick="save('${m.id}')" data-i18n="ui_ddfcaf9d0144">حفظ</button><button class="${m.active?'danger':'green'}" onclick="toggle('${m.id}',${!m.active})">${m.active?'تحويل لصيانة':'إعادة للتشغيل'}</button></div>`).join(''):'لا توجد مكائن'}catch(e){list.textContent='تعذر التحميل: '+e.message}}async function addMachine(){try{await api('/api/manufacturing-machines',{method:'POST',body:JSON.stringify({work_center:center.value,display_name:name.value,code:code.value||undefined,machine_no:Number(no.value||0)||null,capabilities:{}})});name.value=code.value=no.value='';load()}catch(e){alert(e.message)}}async function save(id){let cap={};try{cap=JSON.parse(document.getElementById('cap-'+id).value||'{}')}catch(e){return alert('المواصفات يجب أن تكون JSON صحيحة')}await api('/api/manufacturing-machines',{method:'PATCH',body:JSON.stringify({id,display_name:document.getElementById('n-'+id).value,capabilities:cap})});load()}async function toggle(id,active){await api('/api/manufacturing-machines',{method:'PATCH',body:JSON.stringify({id,active})});load()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.c;load()});if(!token)location.href='/';else load();</script></body></html>
